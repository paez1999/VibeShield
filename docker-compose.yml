version: '3.9'

services:
  api:
    build: ./backend
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: 3000
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      CORS_ORIGIN: http://localhost:5173
    ports:
      - '3000:3000'
    volumes:
      - ./backend:/app
      - /app/node_modules
    command: npm run dev

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - api
    environment:
      VITE_API_TARGET: http://api:3000
    ports:
      - '5173:5173'
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev -- --host
